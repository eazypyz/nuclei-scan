name: Nuclei Scan to Discord

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Sumber target"
        type: choice
        required: true
        default: "asset-dashboard"
        options:
          - asset-dashboard
          - targets_file
          - single_target
      target:
        description: "Diisi hanya jika source = single_target (contoh: example.com)"
        required: false
        default: ""
  
env:
  CHUNKS: 6   # jumlah runner paralel, sesuaikan (max 10-20 biasanya cukup untuk ribuan subdomain)

jobs:
  # ============================================================
  # JOB 1: Ambil target (asset-dashboard / targets.txt repo sendiri / single target), cek host hidup, split chunk
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunk_count: ${{ steps.split.outputs.chunk_count }}
    steps:
      - name: Checkout repo ini (untuk baca targets.txt milik sendiri)
        uses: actions/checkout@v4
        with:
          path: this-repo

      - name: Checkout repo asset-dashboard (sumber data domain)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.source == 'asset-dashboard' || github.event.inputs.source == ''
        uses: actions/checkout@v4
        with:
          repository: eazypyz/asset-dashboard
          path: asset-dashboard
          sparse-checkout: |
            data/history
          sparse-checkout-cone-mode: false

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Build targets.txt sesuai sumber yang dipilih
        run: |
          rm -f targets.txt
          touch targets.txt

          SOURCE="${{ github.event.inputs.source }}"
          # Default ke asset-dashboard kalau trigger bukan manual (misal jadwal cron)
          if [ -z "$SOURCE" ]; then
            SOURCE="asset-dashboard"
          fi

          echo "Sumber target dipilih: $SOURCE"

          case "$SOURCE" in
            single_target)
              if [ -z "${{ github.event.inputs.target }}" ]; then
                echo "ERROR: source=single_target tapi field 'target' kosong."
                exit 1
              fi
              echo "${{ github.event.inputs.target }}" > targets.txt
              ;;

            targets_file)
              if [ ! -f "this-repo/targets.txt" ]; then
                echo "ERROR: File targets.txt tidak ditemukan di root repo ini."
                exit 1
              fi
              cp this-repo/targets.txt targets.txt
              ;;

            asset-dashboard)
              DOMAIN_DIR="asset-dashboard/data/history"
              if [ -d "$DOMAIN_DIR" ]; then
                for f in "$DOMAIN_DIR"/*.json; do
                  [ -e "$f" ] || continue
                  jq -r '.[]?.host // empty' "$f" >> targets.txt || true
                done
              else
                echo "ERROR: Folder $DOMAIN_DIR tidak ditemukan."
                exit 1
              fi
              ;;
          esac

          sed -i '/^$/d' targets.txt
          sort -u -o targets.txt targets.txt
          echo "Total target mentah: $(wc -l < targets.txt)"
          cat targets.txt


      - name: Install httpx (probe host hidup)
        run: |
          curl -sL https://github.com/projectdiscovery/httpx/releases/latest/download/httpx_$(curl -s https://api.github.com/repos/projectdiscovery/httpx/releases/latest | grep tag_name | cut -d '"' -f4 | tr -d 'v')_linux_amd64.zip -o httpx.zip
          unzip -o httpx.zip httpx
          chmod +x httpx
          sudo mv httpx /usr/local/bin/httpx

      - name: Probing host yang hidup saja
        run: |
          # -silent: no banner, -mc: match status code apapun asal ada respons
          # -threads tinggi karena ini cuma HTTP probe ringan, bukan full scan
          httpx -l targets.txt -silent -threads 100 -timeout 5 -retries 1 -o alive.txt || true

          if [ ! -s alive.txt ]; then
            echo "Tidak ada host yang merespons, pakai daftar mentah sebagai fallback."
            cp targets.txt alive.txt
          fi
          echo "Total host hidup: $(wc -l < alive.txt)"

      - name: Split menjadi beberapa chunk untuk scan paralel
        id: split
        run: |
          mkdir -p chunks
          TOTAL=$(wc -l < alive.txt)
          if [ "$TOTAL" -eq 0 ]; then
            echo "0" > chunks/00
            echo "chunk_count=1" >> "$GITHUB_OUTPUT"
          else
            split -n l/${{ env.CHUNKS }} -d alive.txt chunks/chunk_
            COUNT=$(ls chunks | wc -l)
            echo "chunk_count=$COUNT" >> "$GITHUB_OUTPUT"
          fi
          ls -la chunks

      - name: Upload chunks sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: target-chunks
          path: chunks/

  # ============================================================
  # JOB 2: Scan tiap chunk secara paralel (matrix)
  # ============================================================
  scan:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6]   # harus >= CHUNKS di atas, kelebihan index otomatis di-skip
    steps:
      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          name: target-chunks
          path: chunks

      - name: Cek apakah chunk index ini ada
        id: check
        run: |
          FILES=(chunks/chunk_*)
          FILE="${FILES[${{ matrix.index }}]:-}"
          if [ -z "$FILE" ] || [ ! -s "$FILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Nuclei templates
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/nuclei-templates
          key: nuclei-templates-${{ github.run_id }}
          restore-keys: nuclei-templates-

      - name: Install Nuclei
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -sL https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | grep tag_name | cut -d '"' -f4 | tr -d 'v')_linux_amd64.zip -o nuclei.zip
          unzip -o nuclei.zip
          chmod +x nuclei
          sudo mv nuclei /usr/local/bin/nuclei
          nuclei -update-templates

      - name: Run Nuclei Scan (chunk ${{ matrix.index }})
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p results
          nuclei -l "${{ steps.check.outputs.file }}" \
            -severity low,medium,high,critical \
            -c 50 \
            -rl 150 \
            -timeout 5 \
            -retries 1 \
            -bs 25 \
            -silent \
            -o results/result-${{ matrix.index }}.txt || true

          [ -f results/result-${{ matrix.index }}.txt ] || echo "Tidak ada temuan." > results/result-${{ matrix.index }}.txt

      - name: Upload hasil chunk
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.index }}
          path: results/result-${{ matrix.index }}.txt

  # ============================================================
  # JOB 3: Gabung semua hasil & kirim ke Discord
  # ============================================================
  notify:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download semua hasil chunk
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: all-results
          merge-multiple: true

      - name: Gabung jadi satu file txt
        run: |
          mkdir -p final
          cat all-results/*.txt > final/nuclei-result.txt 2>/dev/null || echo "Tidak ada hasil." > final/nuclei-result.txt
          echo "Total baris hasil akhir: $(wc -l < final/nuclei-result.txt)"

      - name: Upload hasil final sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-result-final
          path: final/nuclei-result.txt

      - name: Kirim hasil ke Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          FILE=final/nuclei-result.txt
          LINES=$(wc -l < "$FILE")

          curl -s -F "payload_json={\"content\": \"✅ **Nuclei Scan selesai (paralel)**\\nTotal baris hasil: ${LINES}\\nWorkflow: ${{ github.workflow }} | Run: ${{ github.run_id }}\"}" \
               -F "file1=@${FILE}" \
               "$DISCORD_WEBHOOK"
